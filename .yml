name: Next.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate and Generate Prisma Client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Build Next.js App
        run: npm run build
